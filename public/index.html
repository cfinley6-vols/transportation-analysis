<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transit Analysis</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M5 6 L12 18 L19 6"/></svg>
        <span>Transit Analysis</span>
      </div>
      <nav id="nav" aria-label="Sections">
        <a href="#map" data-view="map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
          Network map</a>
        <a href="#intersections" data-view="intersections">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          Intersections</a>
        <a href="#observations" data-view="observations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
          Observations</a>
        <a href="#routes" data-view="routes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M6 16.5V12a3 3 0 0 1 3-3h6a3 3 0 0 0 3-3V7.5"/></svg>
          Routes</a>
        <a href="#reports" data-view="reports">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          Reports</a>
        <a href="#plan" data-view="plan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          Plan a route</a>
      </nav>
      <div class="db-status" id="db-status"><i></i><span>Connecting…</span></div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
